<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Map - 就活比較</title>
<meta name="description" content="企業比較・選考ステータス・カレンダー・マイページ管理・自己分析ノート・ES対策まで、就活に必要な情報を自分専用にまとめて管理できるツール。データはブラウザ内だけに保存され、外部には送信されません。">
<meta property="og:title" content="Career Map - 就活比較">
<meta property="og:description" content="企業比較・選考ステータス・カレンダー・マイページ管理・自己分析ノート・ES対策を一元管理できる、自分専用の就活管理ツール。データはブラウザ内だけに保存されます。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6fed">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Career Map">
<!-- 更新のたびにこの値を変える（例: 2026-09-10-1）。ホーム画面追加時の更新チェックに使用。 -->
<meta name="app-version" content="2026-09-11-1">
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --text:#1a1d23; --sub:#5b6472;
    --border:#e2e6ec; --accent:#2f6fed; --accent-soft:#eaf1ff;
    --tierS:#ef4444; --tierA:#f97316; --tierB:#eab308; --tierC:#60a5fa; --tierD:#9ca3af; --tierO:#c7cbd1;
    --danger:#ef4444; --danger-soft:#fef2f2; --ok:#16a34a; --ok-soft:#f0fdf4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#14161a; --card:#1d2027; --text:#eef0f3; --sub:#9aa3b2;
      --border:#2b2f38; --accent:#5b8dff; --accent-soft:#20304f; --danger-soft:#3a2020; --ok-soft:#0f2a1a; }
  }
  :root[data-theme="dark"]{ --bg:#14161a; --card:#1d2027; --text:#eef0f3; --sub:#9aa3b2;
    --border:#2b2f38; --accent:#5b8dff; --accent-soft:#20304f; --danger-soft:#3a2020; --ok-soft:#0f2a1a; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5;transition:background .2s,color .2s;}
  a{color:var(--accent);}
  button,input,select,textarea{font-family:inherit;}
  button{transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s;}
  button:active{transform:scale(.97);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}
  header{padding:22px 20px 10px;}
  header .wrap{padding:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header .wrap.wrap-stack{flex-direction:column;align-items:stretch;}
  h1{font-size:19px;margin:0 0 4px;}
  header p{margin:0;color:var(--sub);font-size:12.5px;max-width:680px;}
  .hd-actions{display:flex;gap:6px;flex-shrink:0;}

  nav.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--border);}
  nav.tabs button{border:none;background:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}

  .summary{display:flex;gap:8px;flex-wrap:wrap;margin:0;}
  .collapse-block{margin-top:14px;}
  .collapse-toggle{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer;text-align:left;}
  .collapse-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .collapse-chev{margin-left:auto;transition:transform .15s;color:var(--sub);}
  .collapse-toggle.open .collapse-chev{transform:rotate(180deg);}
  .collapse-toggle-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;}
  .collapse-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;}
  .collapse-panel.open{grid-template-rows:1fr;margin-top:8px;}
  .collapse-inner{overflow:hidden;min-height:0;}
  .sum-pill{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;min-width:70px;text-align:center;}
  .sum-pill b{display:block;font-size:17px;line-height:1.3;color:var(--accent);}
  .sum-pill-clickable{cursor:pointer;transition:border-color .15s,background .15s;}
  .sum-pill-clickable:hover{border-color:var(--accent);}
  .sum-pill-clickable.on{background:var(--accent-soft);border-color:var(--accent);}
  .status-filter-info{margin-top:8px;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:8px;}
  .status-filter-info button{background:none;border:none;color:inherit;font-weight:700;cursor:pointer;font-size:12px;}

  .update-banner{position:sticky;top:0;z-index:70;background:var(--accent);color:#fff;padding:10px 16px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center;}
  .update-banner button{background:#fff;color:var(--accent);border:none;border-radius:7px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .backup-box{margin-top:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .backup-box span{color:var(--text);}
  .deadline-box{margin-top:12px;background:var(--danger-soft);border:1px solid #fca5a5;border-radius:10px;padding:10px 14px;font-size:12.5px;}
  .deadline-box .dl-title{font-weight:700;color:#dc2626;margin-bottom:6px;}
  .dl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:2px 0;cursor:pointer;}
  .dl-date{font-weight:700;font-variant-numeric:tabular-nums;}

  .controls{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .controls input[type=text]{flex:1 1 200px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;}
  .controls select{padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--sub);user-select:none;transition:background .15s,border-color .15s,color .15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}

  .view-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap;}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:var(--card);color:var(--sub);padding:7px 12px;font-size:12.5px;cursor:pointer;}
  .seg button.active{background:var(--accent);color:#fff;}
  .btn{border:none;border-radius:8px;font-weight:600;padding:8px 14px;font-size:12.5px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-gray{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn-gray:hover{border-color:var(--accent);color:var(--accent);}
  .btn-gray.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .btn-red{background:var(--danger);color:#fff;}
  .btn-red:hover{filter:brightness(1.08);}
  .btn-sm{padding:6px 10px;font-size:11.5px;}
  .icon-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}

  .count{margin-top:10px;font-size:12px;color:var(--sub);}

  .grid{margin-top:10px;padding-bottom:70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;transition:box-shadow .15s,transform .15s,border-color .15s;}
  .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px);border-color:var(--accent);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-top h2{font-size:15px;margin:0;line-height:1.4;}
  .fav-star{background:none;border:none;font-size:16px;cursor:pointer;line-height:1;padding:2px;color:var(--border);flex-shrink:0;}
  .fav-star.on{color:#f59e0b;}
  .card-name-row{display:flex;align-items:flex-start;gap:4px;flex:1;min-width:0;}
  .card-name-row h2{flex:1;min-width:0;overflow-wrap:anywhere;}
  .mypage-inline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:2px;background:var(--bg);border-radius:8px;padding:6px 8px;}
  .mypage-inline-label{font-weight:700;color:var(--sub);white-space:nowrap;}
  .mypage-inline-empty{color:var(--sub);}
  .mypage-inline-val{font-weight:600;overflow-wrap:anywhere;}
  .mypage-inline-pw{font-family:monospace;letter-spacing:1px;}
  .mypage-inline-open{text-decoration:none;flex-shrink:0;white-space:nowrap;}
  .mypage-inline button{background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px;color:var(--sub);}
  .mypage-inline button:hover{color:var(--accent);}
  .tier{font-size:11px;font-weight:800;color:#fff;padding:3px 9px;border-radius:6px;white-space:nowrap;}
  .tier.unset{background:var(--border);color:var(--sub);}
  .industry{font-size:12px;color:var(--sub);}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:4px;font-size:12px;}
  .metric-label{color:var(--sub);}
  .metric-val{font-weight:600;}
  .fit{display:flex;align-items:center;gap:4px;margin-top:2px;}
  .fit-dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
  .fit-dot.on{background:var(--accent);}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .tag{font-size:10px;background:var(--accent-soft);color:var(--accent);padding:3px 7px;border-radius:6px;}
  .my-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block;margin-top:2px;}
  .compare-check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:6px;border:2px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .compare-check.on{background:var(--accent);border-color:var(--accent);}
  .empty{margin:40px 0;color:var(--sub);font-size:14px;text-align:center;}
  .empty::before{content:'📭';display:block;font-size:32px;margin-bottom:8px;}
  .note-group{margin-top:18px;}
  .note-group-hd{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .note-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .note-card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .note-card-hd strong{font-size:13.5px;}
  .note-card-actions{display:flex;gap:6px;flex-shrink:0;}
  .note-card-body{font-size:13px;line-height:1.7;white-space:pre-wrap;margin-top:8px;color:var(--text);}

  .tier-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .tier-lbl{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;}
  .tier-lane{flex:1;display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;min-height:40px;}
  .tier-chip{border:none;background:var(--bg);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;}
  .tier-chip:hover{background:var(--accent-soft);color:var(--accent);}
  .tier-empty{font-size:11px;color:var(--sub);align-self:center;margin-left:4px;}

  .cmp-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:10px 20px;display:flex;justify-content:center;gap:10px;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:40;}
  .cmp-bar span{font-size:12.5px;color:var(--sub);}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:24px 12px;}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto;display:flex;flex-direction:column;overflow:hidden;}
  .modal.wide{max-width:820px;}
  .modal.detail-modal{height:min(640px, calc(100vh - 48px));}
  .modal-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--card);border-radius:16px 16px 0 0;flex-shrink:0;}
  .modal-hd h2{font-weight:700;font-size:15px;margin:0;}
  .name-inline-inp{font-size:16px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;margin:-4px 0 0 -6px;width:calc(100% + 6px);color:var(--text);font-family:inherit;}
  .name-inline-inp:hover{border-color:var(--border);}
  .name-inline-inp:focus{border-color:var(--accent);background:var(--card);outline:none;}
  .modal-x{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1;}
  .modal-bd{padding:20px;overflow-y:auto;flex:1;min-height:0;}
  .dtab-row{width:100%;}
  .dtab-row button{flex:1;padding:8px 6px;font-size:11.5px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:12.5px;margin-top:6px;}
  .detail-grid .k{color:var(--sub);}
  .detail-grid .v{font-weight:600;}
  .detail-sec{margin-top:16px;}
  .detail-sec h3{font-size:12.5px;color:var(--sub);margin:0 0 4px;font-weight:700;}
  .detail-sec p{font-size:13px;line-height:1.7;margin:0;white-space:pre-wrap;}
  .mypage-box{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:6px;}
  .mypage-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .mypage-row:last-child{margin-bottom:0;}
  .mypage-k{font-size:11px;font-weight:700;color:var(--sub);width:24px;flex-shrink:0;}
  .mypage-v{font-size:13px;font-weight:600;flex:1;overflow-wrap:anywhere;}
  .mypage-pw{font-family:monospace;letter-spacing:1px;}
  .btn-sm{padding:4px 9px;font-size:11px;border-radius:6px;}
  .status-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .st-pill{padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--border);cursor:pointer;background:var(--card);color:var(--sub);transition:background .15s,border-color .15s,color .15s;}
  .st-pill:hover{border-color:var(--accent);}
  .st-pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .ta{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:16px;background:var(--card);color:var(--text);resize:vertical;font-family:inherit;margin-top:6px;}
  .inp{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:16px;background:var(--card);color:var(--text);}
  .sel{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:16px;background:var(--card);color:var(--text);}
  .lbl{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ev-card{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .ev-card-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ev-del{background:none;border:none;color:#f87171;font-size:14px;margin-left:auto;cursor:pointer;}
  .btn-armed{background:var(--danger)!important;color:#fff!important;border-color:var(--danger)!important;font-size:11px!important;font-weight:700;}
  .ev-memo{font-size:12px;color:var(--sub);margin-top:6px;white-space:pre-wrap;}
  .ev-add{background:var(--bg);border-radius:10px;padding:10px;}
  .ev-add-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .ev-add-row input,.ev-add-row select{border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:16px;background:var(--card);color:var(--text);}
  .ev-type-btn{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid var(--border);cursor:pointer;background:var(--card);color:var(--sub);}
  .ev-type-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .cmp-table{border-collapse:collapse;width:100%;font-size:12px;}
  .cmp-table th,.cmp-table td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  .cmp-table thead th{background:var(--accent-soft);}
  .cmp-table thead th:first-child,.cmp-table td:first-child{text-align:left;background:var(--bg);position:sticky;left:0;min-width:78px;}
  .table-wrap{overflow-x:auto;}
  .form-actions{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  footer{padding:0 20px 40px;color:var(--sub);font-size:11px;}
  .note{font-size:11px;color:var(--sub);margin-top:2px;}

  /* calendar */
  .cal-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav h3{margin:0;font-size:14px;font-weight:700;}
  .cal-nav button{background:var(--bg);border:none;border-radius:8px;padding:5px 12px;font-size:15px;font-weight:700;cursor:pointer;color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dh{text-align:center;font-size:11px;font-weight:700;padding:4px;color:var(--sub);}
  .cal-dh.sun{color:#ef4444;} .cal-dh.sat{color:#60a5fa;}
  .cal-cell{min-height:56px;border-radius:8px;padding:3px;cursor:pointer;background:var(--bg);}
  .cal-cell.empty{background:none;cursor:default;}
  .cal-cell.today{outline:2px solid var(--accent);}
  .cal-cell.selected{background:var(--accent-soft);}
  .cal-date{font-size:11px;font-weight:700;margin-bottom:2px;}
  .cal-date.sun{color:#ef4444;} .cal-date.sat{color:#60a5fa;}
  .cal-dot{font-size:9px;padding:1px 4px;border-radius:4px;margin-bottom:1px;white-space:nowrap;overflow:hidden;background:var(--accent-soft);color:var(--accent);}
  .cal-detail{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
  .settings-menu{position:absolute;right:20px;top:60px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;z-index:60;display:none;min-width:200px;}
  .settings-menu.open{display:block;}
  .settings-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 10px;font-size:12.5px;color:var(--text);cursor:pointer;border-radius:6px;}
  .settings-menu button:hover{background:var(--bg);}
  @media (max-width:520px){
    .wrap{padding:0 12px;}
    .cal-wrap{padding:10px;border-radius:10px;}
    .cal-grid{gap:2px;}
    .cal-cell{min-height:40px;padding:2px;border-radius:6px;}
    .cal-date{font-size:10px;}
    .cal-dh{font-size:9.5px;padding:2px;}
    .cal-dot{font-size:7.5px;padding:1px 3px;margin-bottom:0;}
    .cal-nav h3{font-size:12.5px;}
    .cal-nav button{padding:4px 9px;font-size:13px;}
    .modal-bd{padding:14px;}
    .grid2{grid-template-columns:1fr;}
    .dtab-row button{font-size:10px;padding:7px 2px;}
  }
  @media (max-width:380px){
    .cal-cell{min-height:34px;}

function parseAiJson(raw){
  let s = raw.trim();

  s = s.replace(/^﻿/, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) s = fence[1].trim();
  const start = s.indexOf('{'), end = s.lastIndexOf('}');
  if(start!==-1 && end!==-1 && end>start) s = s.slice(start, end+1);

function subOptions(major){
  const defaults = INDUSTRY_SUB_MAP[major] || [];
  const custom = (loadCustomSubs()[major]) || [];
  return [...defaults, ...custom.filter(s=>!defaults.includes(s))];
}
function registerSubIfNew(major, sub){
  if(!major || !sub) return;
  const combined = subOptions(major);
  if(!combined.includes(sub)){
    const map = loadCustomSubs();
    map[major] = [...(map[major]||[]), sub];
    saveCustomSubs(map);
  }

function migrateCompany(c){
  let out = c;
  // 旧スキーム(startingSalary 単一文字列)から 基本給/手当額/合計額 の3項目へ移行
  if(out.salaryTotal===undefined){
    const {startingSalary, ...rest} = out;
    out = {salaryBase:'', salaryAllowance:'', salaryTotal: startingSalary||'', ...rest};
  }
  // 旧スキーム(industry 単一文字列)から 大分類/詳細分類の2項目へ移行
  if(out.industryMajor===undefined){
    const {industry, ...rest} = out;
    out = {industryMajor: industry?'その他':'', industrySub: industry||'', ...rest};
  }
  // esRecords に phase(季節/選考区分) フィールドを補完
  if(Array.isArray(out.esRecords)){
    out = {...out, esRecords: out.esRecords.map(r=>({phase:'', ...r}))};
  }
  return out;
}

  }));

function applyFilters(){
  let list = companies.filter(c=>{
    if(state.tierFilters.length>0){
      const match = state.tierFilters.some(t=> t==='__unset' ? !c.tier : c.tier===t);
      if(!match) return false;
    }
    if(state.industryFilters.length>0 && !state.industryFilters.includes(c.industryMajor)) return false;
    if(state.statusFilter && !(c.status||[]).includes(state.statusFilter)) return false;
    if(state.search){
      const q = state.search.toLowerCase();
      const hay = (c.name+(c.industryMajor||'')+(c.industrySub||'')+(c.tags||[]).join(' ')+(c.mainBusiness||'')+(c.strengths||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(state.sort==='tier') list.sort((a,b)=>TIER_ORDER.indexOf(a.tier||'')-TIER_ORDER.indexOf(b.tier||'')||a.name.localeCompare(b.name,'ja'));
  else if(state.sort==='dsfit_desc') list.sort((a,b)=>(b.dsFit||0)-(a.dsFit||0));
  else if(state.sort==='favorite') list.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||a.name.localeCompare(b.name,'ja'));
  else if(state.sort==='deadline'){
    const tod = today();
    const nextDate = c => {
      const upcoming = (c.events||[]).map(evEnd).filter(d=>d>=tod).sort();
      return upcoming[0] || '9999-99-99';
    };
    list.sort((a,b)=>nextDate(a).localeCompare(nextDate(b))||a.name.localeCompare(b.name,'ja'));
  }
  else list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  return list;
}

function renderTierBoard(list){

function bindContentEvents(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('[data-cmpchk]')) return;
      const id = Number(el.dataset.open);
      if(cmpMode){ toggleCmp(id); return; }
      openDetail(id);
    });
  });
  document.querySelectorAll('[data-cmpchk]').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); toggleCmp(Number(el.dataset.cmpchk)); });
  });
  document.querySelectorAll('[data-mypagerow]').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); });
  });
  document.querySelectorAll('[data-toggleinlinepw]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const id = Number(el.dataset.toggleinlinepw);
      if(revealedPw.has(id)) revealedPw.delete(id); else revealedPw.add(id);
      renderContent();
    });
  });
  document.querySelectorAll('[data-fav]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const id = Number(el.dataset.fav);
      saveCompanies(companies.map(x=>x.id===id?{...x, favorite:!x.favorite}:x));
      renderContent();
    });
  });
}
function toggleCmp(id){
  if(cmpSel.includes(id)) cmpSel = cmpSel.filter(x=>x!==id);
  else if(cmpSel.length<5) cmpSel.push(id);
  renderContent();
}
function renderCmpBar(){
  const bar = document.getElementById('cmpBar');
  if(cmpMode && cmpSel.length>0){ bar.style.display='flex'; document.getElementById('cmpCount').textContent = `${cmpSel.length}社選択中（最大5社）`; }
  else bar.style.display='none';
}

// confirm()を使うとダイアログの多用でブラウザに抑制され反応しなくなることがあるため、
// ボタンを2回クリックすることで確定する「アーム式」の削除パターンを使う（ネイティブダイアログ不使用）。
function armDeleteButton(btn, label, onConfirm){
  if(btn.dataset.armed==='1'){
    onConfirm();
    return;
  }
  btn.dataset.armed = '1';
  btn.dataset.origText = btn.textContent;
  btn.textContent = label || 'もう一度押すと削除';
  btn.classList.add('btn-armed');
  if(btn._armTimeout) clearTimeout(btn._armTimeout);
  btn._armTimeout = setTimeout(()=>{
    btn.dataset.armed = '0';
    btn.textContent = btn.dataset.origText;
    btn.classList.remove('btn-armed');
  }, 4000);
}

      <div class="modal-hd"><h2>${isNew?'企業を追加':esc(c.name)+' を編集'}</h2><button class="modal-x" id="closeEdit">&times;</button></div>
      <div style="padding:10px 20px 0;flex-shrink:0;">
        <div class="seg dtab-row" id="editTabRow">
          <button type="button" data-edittab="overview" class="active">📋 概要</button>
          <button type="button" data-edittab="status">⭐ ステータス</button>
        </div>
      </div>
      <div class="modal-bd">
        <div class="field"><label class="lbl">企業名 *（候補から選択、またはそのまま自由入力）</label>
          <input class="inp" id="fName" list="companyNameList" value="${esc(c.name)}">
          <datalist id="companyNameList">${[...new Set([...COMPANY_NAME_CANDIDATES, ...companies.map(x=>x.name)])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        </div>

        <div data-edittabpage="overview">
          <div class="field">
            <p class="note" style="margin:0 0 6px;">👆 まず上の「企業名」を入力してから、下のボタンを押してください（企業名入りのプロンプトが自動で作られます）。</p>
            <button type="button" class="btn btn-gray" id="btnToggleAiFill">🤖 AIに調べてもらって一括入力</button>
          </div>
          <div id="aiFillBox" style="display:none;margin-bottom:16px;background:var(--bg);border-radius:10px;padding:12px;">
            <p class="note" style="margin:0 0 8px;">① 下のプロンプトをコピーし、ChatGPTやClaudeなどに貼り付けて送信 → ② 返ってきたJSONをそのまま下の欄に貼り付けて「反映」を押してください。</p>
            <textarea class="ta" id="aiPrompt" rows="6" readonly style="font-size:11.5px;font-family:monospace;">${esc(buildAiPrompt(c.name))}</textarea>
            <div style="text-align:right;margin-top:4px;"><button type="button" class="btn btn-gray btn-sm" id="btnCopyAiPrompt">📋 プロンプトをコピー</button></div>
            <label class="lbl" style="margin-top:10px;">AIの回答（JSON）を貼り付け</label>
            <textarea class="ta" id="aiResponse" rows="6" placeholder='{"industryMajor": "...", ...}' autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:6px;">
              <p class="note" style="margin:0;">⚠️ AIが調べた内容は実際と異なる場合があります。反映後は必ず採用ページ等の一次情報で確認してください。</p>
              <button type="button" class="btn btn-primary btn-sm" id="btnApplyAiFill">反映する</button>
            </div>
          </div>
          <div class="grid2">
            <div class="field"><label class="lbl">業界（大分類）</label>
              <select class="sel" id="fIndustryMajor">
                <option value="">未選択</option>
                ${INDUSTRY_MAJOR_LIST.map(i=>`<option value="${esc(i)}" ${c.industryMajor===i?'selected':''}>${esc(i)}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label class="lbl">業界（詳細・候補から選択、なければ自由入力で追加）</label>
              <input class="inp" id="fIndustrySub" list="industrySubList" value="${esc(c.industrySub)}">
              <datalist id="industrySubList">${subOptions(c.industryMajor).map(i=>`<option value="${esc(i)}">`).join('')}</datalist>
            </div>
          </div>
          <div class="field"><label class="lbl">勤務地</label><input class="inp" id="fLocation" value="${esc(c.location)}"></div>
          <div class="field">
            <label class="lbl">初任給の内訳</label>
            <div class="grid2" style="grid-template-columns:1fr 1fr 1fr;gap:8px;">
              <div><label class="lbl" style="font-weight:400;">基本給</label><input class="inp" id="fSalaryBase" value="${esc(c.salaryBase)}" placeholder="例: 22万円"></div>
              <div><label class="lbl" style="font-weight:400;">手当額</label><input class="inp" id="fSalaryAllowance" value="${esc(c.salaryAllowance)}" placeholder="例: 1.5万円"></div>
              <div><label class="lbl" style="font-weight:400;">合計額</label><input class="inp" id="fSalaryTotal" value="${esc(c.salaryTotal)}" placeholder="例: 23.5万円"></div>
            </div>
            <p class="note">数値のみ入力されている場合、合計額が空欄なら自動計算します。</p>
          </div>
          <div class="grid2">
            <div class="field"><label class="lbl">平均年収</label><input class="inp" id="fAvg" value="${esc(c.avgSalary)}"></div>
            <div></div>
          </div>
          <div class="grid2">
            <div class="field"><label class="lbl">月残業</label><input class="inp" id="fOvertime" value="${esc(c.overtime)}"></div>
            <div class="field"><label class="lbl">有給取得率</label><input class="inp" id="fPaid" value="${esc(c.paidLeaveRate)}"></div>
          </div>
          <div class="grid2">
            <div class="field"><label class="lbl">年間休日</label><input class="inp" id="fHolidays" value="${esc(c.annualHolidays)}" placeholder="例: 120日"></div>
            <div class="field"><label class="lbl">平均勤続年数</label><input class="inp" id="fTenure" value="${esc(c.avgTenure)}" placeholder="例: 12.5年"></div>
          </div>
          <div class="grid2">
            <div class="field"><label class="lbl">離職率</label><input class="inp" id="fTurnover" value="${esc(c.turnoverRate)}"></div>
            <div class="field"><label class="lbl">転勤の有無</label><input class="inp" id="fTransfer" value="${esc(c.transfer)}" placeholder="例: あり(全国)／なし"></div>
          </div>
          <div class="grid2">
            <div class="field"><label class="lbl">リモートワーク</label><input class="inp" id="fRemote" value="${esc(c.remote)}"></div>
            <div class="field"><label class="lbl">従業員数</label><input class="inp" id="fEmployees" value="${esc(c.employeeCount)}" placeholder="例: 単体3,200名"></div>
          </div>
          <div class="field"><label class="lbl">スキル適性 (0〜5)</label><input class="inp" type="number" min="0" max="5" id="fDsFit" value="${c.dsFit||0}"><p class="note">自分の専攻・スキル・強みをどれだけ活かせそうかの目安（データサイエンス/ITに限らず、自分の専門性で読み替えてOK）</p></div>
          <div class="field"><label class="lbl">タグ（カンマ区切り）</label><input class="inp" id="fTags" value="${esc((c.tags||[]).join(', '))}"></div>
          <div class="field"><label class="lbl">事業内容</label><textarea class="ta" rows="2" id="fBiz">${esc(c.mainBusiness)}</textarea></div>
          <div class="field"><label class="lbl">強み</label><textarea class="ta" rows="2" id="fStrengths">${esc(c.strengths)}</textarea></div>
          <div class="field"><label class="lbl">懸念点</label><textarea class="ta" rows="2" id="fWeak">${esc(c.weaknesses)}</textarea></div>
          <div class="field"><label class="lbl">採用ページURL</label><input class="inp" id="fUrl" value="${esc(c.url)}" placeholder="https://..."></div>
        </div>

        <div data-edittabpage="status" style="display:none;">
          <div class="field"><label class="lbl">志望度</label>
            <select class="sel" id="fTier"><option value="">未設定</option>${['S','A','B','C','D','その他'].map(t=>`<option ${c.tier===t?'selected':''}>${t}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label class="lbl">マイページ（応募者専用ページ）</label>
            <div class="grid2" style="margin-bottom:8px;">
              <input class="inp" id="fMypageUrl" value="${esc(c.mypageUrl)}" placeholder="マイページURL">
              <input class="inp" id="fMypageId" value="${esc(c.mypageId)}" placeholder="ログインID">
            </div>
            <input class="inp" id="fMypagePassword" value="${esc(c.mypagePassword)}" placeholder="パスワード">
            <p class="note">⚠️ このブラウザのlocalStorageに平文で保存されます。重要なパスワードの使い回しは避け、この企業専用のパスワードを設定することをおすすめします。</p>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" id="btnSaveCo">保存</button>
          <button class="btn btn-gray" id="btnCancelEdit">キャンセル</button>
        </div>
      </div>
    </div>
  `;
}
function bindOverlayEvents(c){
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click', e=>{ if(e.target===overlay){ closeOverlay(); afterChange(); } });
  // 詳細モーダルのタブ切替（入力中の内容が消えないよう再描画はせずDOM操作のみで切替）
  overlay.querySelectorAll('[data-dtab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tab = btn.dataset.dtab;
      detailTab = tab;
      overlay.querySelectorAll('[data-dtab]').forEach(b=>b.classList.toggle('active', b===btn));
      overlay.querySelectorAll('[data-dtabpage]').forEach(p=>{ p.style.display = (p.dataset.dtabpage===tab) ? '' : 'none'; });
    });
  });
  // 編集モーダルの概要/ステータス タブ切替（入力中の内容が消えないよう再描画はせずDOM操作のみで切替）
  overlay.querySelectorAll('[data-edittab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tab = btn.dataset.edittab;
      overlay.querySelectorAll('[data-edittab]').forEach(b=>b.classList.toggle('active', b===btn));
      overlay.querySelectorAll('[data-edittabpage]').forEach(p=>{ p.style.display = (p.dataset.edittabpage===tab) ? '' : 'none'; });
    });
  });
  const close1 = overlay.querySelector('#closeDetail'); if(close1) close1.addEventListener('click', ()=>{ closeOverlay(); afterChange(); });
  const close2 = overlay.querySelector('#closeEdit'); if(close2) close2.addEventListener('click', ()=>{ closeOverlay(); afterChange(); });
  const cancelEdit = overlay.querySelector('#btnCancelEdit'); if(cancelEdit) cancelEdit.addEventListener('click', ()=>{ closeOverlay(); afterChange(); });

  const majorSel = overlay.querySelector('#fIndustryMajor');
  if(majorSel){
    majorSel.addEventListener('change', ()=>{
      const subDatalist = overlay.querySelector('#industrySubList');
      const subInput = overlay.querySelector('#fIndustrySub');
      subDatalist.innerHTML = subOptions(majorSel.value).map(i=>`<option value="${esc(i)}">`).join('');
      subInput.value = '';
    });
  }

  // 既存企業の詳細モーダルでは「編集」モードを設けず、概要・ステータスの各項目は
  // フォーカスを外す（change）たびに自動保存する。新規追加（editMode）の場合のみ、
  // 一括入力後にまとめて保存ボタンで確定する従来の方式のまま。
  if(!editMode && c && companies.some(x=>x.id===c.id)){
    function freshCo(){ return companies.find(x=>x.id===c.id) || c; }
    const fNameInp = overlay.querySelector('#fName');
    if(fNameInp){
      fNameInp.addEventListener('change', ()=>{
        const name = fNameInp.value.trim();
        if(!name){ fNameInp.value = freshCo().name; return; }
        saveCompanies(companies.map(x=>x.id===c.id?{...freshCo(), name}:x));
        afterChange();
      });
    }
    function saveOverviewFields(){
      const fresh = freshCo();
      const industryMajor = overlay.querySelector('#fIndustryMajor').value;
      const industrySub = overlay.querySelector('#fIndustrySub').value.trim();
      let salaryBase = overlay.querySelector('#fSalaryBase').value.trim();
      let salaryAllowance = overlay.querySelector('#fSalaryAllowance').value.trim();
      let salaryTotal = overlay.querySelector('#fSalaryTotal').value.trim();
      if(!salaryTotal && salaryBase && salaryAllowance){
        const b = parseFloat(salaryBase), a = parseFloat(salaryAllowance);
        if(!isNaN(b) && !isNaN(a) && /^[\d.]+$/.test(salaryBase) && /^[\d.]+$/.test(salaryAllowance)){
          salaryTotal = String(Math.round((b+a)*100)/100) + (salaryBase.match(/[^\d.]+$/)?salaryBase.match(/[^\d.]+$/)[0]:'');
        }
      }
      const updated = {
        ...fresh,
        industryMajor, industrySub,
        location: overlay.querySelector('#fLocation').value,
        salaryBase, salaryAllowance, salaryTotal,
        avgSalary: overlay.querySelector('#fAvg').value,
        overtime: overlay.querySelector('#fOvertime').value,
        paidLeaveRate: overlay.querySelector('#fPaid').value,
        annualHolidays: overlay.querySelector('#fHolidays').value,
        avgTenure: overlay.querySelector('#fTenure').value,
        turnoverRate: overlay.querySelector('#fTurnover').value,
        transfer: overlay.querySelector('#fTransfer').value,
        remote: overlay.querySelector('#fRemote').value,
        employeeCount: overlay.querySelector('#fEmployees').value,
        dsFit: Number(overlay.querySelector('#fDsFit').value)||0,
        tags: overlay.querySelector('#fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
        mainBusiness: overlay.querySelector('#fBiz').value,
        strengths: overlay.querySelector('#fStrengths').value,
        weaknesses: overlay.querySelector('#fWeak').value,
        url: normalizeUrl(overlay.querySelector('#fUrl').value),
      };
      registerSubIfNew(industryMajor, industrySub);
      saveCompanies(companies.map(x=>x.id===c.id?updated:x));
      afterChange();
    }
    ['fIndustryMajor','fIndustrySub','fLocation','fSalaryBase','fSalaryAllowance','fSalaryTotal','fAvg','fOvertime','fPaid','fHolidays','fTenure','fTurnover','fTransfer','fRemote','fEmployees','fDsFit','fTags','fBiz','fStrengths','fWeak','fUrl'].forEach(id=>{
      const el = overlay.querySelector('#'+id);
      if(el) el.addEventListener('change', saveOverviewFields);
    });
    overlay.querySelectorAll('[data-tierpick]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        saveCompanies(companies.map(x=>x.id===c.id?{...freshCo(), tier:btn.dataset.tierpick}:x));
        renderOverlay(); afterChange();
      });
    });
    function saveMypageFields(){
      saveCompanies(companies.map(x=>x.id===c.id?{
        ...freshCo(),
        mypageUrl: normalizeUrl(overlay.querySelector('#fMypageUrl').value),
        mypageId: overlay.querySelector('#fMypageId').value,
        mypagePassword: overlay.querySelector('#fMypagePassword').value,
      }:x));
    }
    ['fMypageUrl','fMypageId','fMypagePassword'].forEach(id=>{
      const el = overlay.querySelector('#'+id);
      if(el) el.addEventListener('change', saveMypageFields);
    });
  }

  const btnToggleAi = overlay.querySelector('#btnToggleAiFill');
  if(btnToggleAi){
    btnToggleAi.addEventListener('click', ()=>{
      const box = overlay.querySelector('#aiFillBox');
      const opening = box.style.display==='none';
      box.style.display = opening ? 'block' : 'none';
      if(opening){
        const nameInput = overlay.querySelector('#fName');
        overlay.querySelector('#aiPrompt').value = buildAiPrompt(nameInput?nameInput.value:c.name);
      }
    });
  }
  const btnCopyAiPrompt = overlay.querySelector('#btnCopyAiPrompt');
  if(btnCopyAiPrompt){
    btnCopyAiPrompt.addEventListener('click', ()=>{
      const val = overlay.querySelector('#aiPrompt').value;
      const done = ()=>{ const old=btnCopyAiPrompt.textContent; btnCopyAiPrompt.textContent='コピーしました'; setTimeout(()=>{btnCopyAiPrompt.textContent=old;},1200); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(done).catch(()=>alert('コピーに失敗しました'));
      else { const ta=overlay.querySelector('#aiPrompt'); ta.select(); try{document.execCommand('copy'); done();}catch(e){alert('コピーに失敗しました');} }
    });
  }
  const btnApplyAiFill = overlay.querySelector('#btnApplyAiFill');
  if(btnApplyAiFill){
    btnApplyAiFill.addEventListener('click', ()=>{
      const raw = overlay.querySelector('#aiResponse').value;
      if(!raw.trim()){ alert('AIの回答を貼り付けてください'); return; }
      let json;
      try{ json = parseAiJson(raw); }catch(e){ alert('JSONの読み取りに失敗しました。{ から } まで、AIの回答全体をそのまま貼り付けているか確認してください（一部だけコピーされていたり、文字が欠けていると失敗します）。'); return; }
      if(editMode){
        applyAiFillToDraft(json);
        alert('反映しました。内容を確認して保存してください（タグに「AI入力(要確認)」を追加しています）。');
      } else {
        applyAiFillToCompany(c.id, json);
        afterChange();
        alert('反映しました。内容を確認してください（タグに「AI入力(要確認)」を追加しています。自動的に保存されています）。');
      }
      renderOverlay();
    });
  }

  const btnDel = overlay.querySelector('#btnDeleteCo');
  if(btnDel) btnDel.addEventListener('click', ()=>{
    if(confirm(`「${c.name}」を削除しますか？この操作は取り消せません。`)){
      saveCompanies(companies.filter(x=>x.id!==c.id));
      closeOverlay(); afterChange();
    }
  });

  overlay.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.copy;
      const done = ()=>{ const old = btn.textContent; btn.textContent='コピー済み'; setTimeout(()=>{ btn.textContent=old; },1200); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(val).then(done).catch(()=>{ alert('コピーに失敗しました'); });
      } else {
        const ta = document.createElement('textarea');
        ta.value = val; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); done(); }catch(e){ alert('コピーに失敗しました'); }
        document.body.removeChild(ta);
      }
    });
  });
  overlay.querySelectorAll('[data-togglepw]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('.mypage-row');
      const span = row.querySelector('.mypage-pw');
      const showing = span.dataset.shown === '1';
      if(showing){ span.textContent = '••••••••'; span.dataset.shown='0'; btn.textContent='表示'; }
      else { span.textContent = span.dataset.pw; span.dataset.shown='1'; btn.textContent='非表示'; }
    });
  });

  overlay.querySelectorAll('[data-mystatus]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const s = btn.dataset.mystatus;
      const cur = c.status||[];
      const next = cur.includes(s) ? cur.filter(x=>x!==s) : [...cur, s];
      saveCompanies(companies.map(x=>x.id===c.id?{...x,status:next}:x));
      renderOverlay();
    });
  });
  const memo = overlay.querySelector('#myMemo');
  if(memo) memo.addEventListener('change', ()=> saveCompanies(companies.map(x=>x.id===c.id?{...x,memo:memo.value}:x)));

  let selEvType = EVENT_TYPES[0];
  overlay.querySelectorAll('[data-evtype]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selEvType = btn.dataset.evtype;
      overlay.querySelectorAll('[data-evtype]').forEach(b=>b.classList.toggle('on', b===btn));
    });
  });
  overlay.querySelectorAll('[data-delev]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      armDeleteButton(btn, 'もう一度押して削除', ()=>{
        const i = Number(btn.dataset.delev);
        const events = [...(c.events||[])].sort((a,b)=>a.date.localeCompare(b.date));
        const target = events[i];
        if(!target) return;
        events.splice(i,1);
        saveCompanies(companies.map(x=>x.id===c.id?{...x,events}:x));
        renderOverlay();
      });
    });
  });
  const btnAddEv = overlay.querySelector('#btnAddEv');
  if(btnAddEv) btnAddEv.addEventListener('click', ()=>{
    const date = overlay.querySelector('#evDate').value;
    if(!date) return;
    const endDate = overlay.querySelector('#evEndDate').value;
    const time = overlay.querySelector('#evTime').value;
    const memoV = overlay.querySelector('#evMemo').value;
    const events = [...(c.events||[]), {type:selEvType, date, endDate, time, memo:memoV}];
    saveCompanies(companies.map(x=>x.id===c.id?{...x,events}:x));
    renderOverlay();
  });

  // ES・面接記録
  const esRecordsNow = c.esRecords||[];
  const editingEsRecord = esEditingId ? esRecordsNow.find(r=>String(r.id)===String(esEditingId)) : null;
  let selEsType = editingEsRecord ? editingEsRecord.type : 'ES設問';
  overlay.querySelectorAll('[data-estype]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selEsType = btn.dataset.estype;
      overlay.querySelectorAll('[data-estype]').forEach(b=>b.classList.toggle('on', b===btn));
    });
  });
  const esAnswerTa = overlay.querySelector('#esAnswer');
  const esAnswerCount = overlay.querySelector('#esAnswerCount');
  if(esAnswerTa && esAnswerCount){
    esAnswerTa.addEventListener('input', ()=>{ esAnswerCount.textContent = `${esAnswerTa.value.length}字`; });
  }
  const btnAddEs = overlay.querySelector('#btnAddEs');
  if(btnAddEs) btnAddEs.addEventListener('click', ()=>{
    const question = overlay.querySelector('#esQuestion').value.trim();
    const answer = overlay.querySelector('#esAnswer').value;
    const phaseEl = overlay.querySelector('#esPhase');
    const phase = phaseEl ? phaseEl.value : '';
    if(!question && !answer){ alert('質問か回答のどちらかは入力してください'); return; }
    const list = c.esRecords||[];
    let newList;
    if(esEditingId){
      newList = list.map(r=>String(r.id)===String(esEditingId)?{...r, type:selEsType, phase, question, answer}:r);
    } else {
      newList = [...list, {id:uid(), type:selEsType, phase, question, answer}];
    }
    esEditingId = null;
    saveCompanies(companies.map(x=>x.id===c.id?{...x, esRecords:newList}:x));
    renderOverlay();
  });
  const btnCancelEsEdit = overlay.querySelector('#btnCancelEsEdit');
  if(btnCancelEsEdit) btnCancelEsEdit.addEventListener('click', ()=>{ esEditingId=null; renderOverlay(); });
  overlay.querySelectorAll('[data-esedit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ esEditingId = btn.dataset.esedit; renderOverlay(); });
  });
  overlay.querySelectorAll('[data-esdel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      armDeleteButton(btn, 'もう一度押して削除', ()=>{
        const list = c.esRecords||[];
        const rec = list.find(r=>String(r.id)===btn.dataset.esdel);
        if(!rec) return;
        const newList = list.filter(r=>String(r.id)!==btn.dataset.esdel);
        if(String(esEditingId)===btn.dataset.esdel) esEditingId=null;
        saveCompanies(companies.map(x=>x.id===c.id?{...x, esRecords:newList}:x));
        renderOverlay();
      });
    });
  });

  const btnSave = overlay.querySelector('#btnSaveCo');
  if(btnSave) btnSave.addEventListener('click', ()=>{
    const name = overlay.querySelector('#fName').value.trim();
    if(!name){ alert('企業名を入力してください'); return; }
    const industryMajor = overlay.querySelector('#fIndustryMajor').value;
    const industrySub = overlay.querySelector('#fIndustrySub').value.trim();
    let salaryBase = overlay.querySelector('#fSalaryBase').value.trim();
    let salaryAllowance = overlay.querySelector('#fSalaryAllowance').value.trim();
    let salaryTotal = overlay.querySelector('#fSalaryTotal').value.trim();
    // 基本給・手当額が数値のみで合計額が未入力の場合は自動計算
    if(!salaryTotal && salaryBase && salaryAllowance){
      const b = parseFloat(salaryBase), a = parseFloat(salaryAllowance);
      if(!isNaN(b) && !isNaN(a) && /^[\d.]+$/.test(salaryBase) && /^[\d.]+$/.test(salaryAllowance)){
        salaryTotal = String(Math.round((b+a)*100)/100) + (salaryBase.match(/[^\d.]+$/)?salaryBase.match(/[^\d.]+$/)[0]:'');
      }
    }
    const updated = {
      ...c,
      name,
      tier: overlay.querySelector('#fTier').value,
      industryMajor, industrySub,
      location: overlay.querySelector('#fLocation').value,
      salaryBase, salaryAllowance, salaryTotal,

      annualHolidays: overlay.querySelector('#fHolidays').value,
      avgTenure: overlay.querySelector('#fTenure').value,
      turnoverRate: overlay.querySelector('#fTurnover').value,
      transfer: overlay.querySelector('#fTransfer').value,
      remote: overlay.querySelector('#fRemote').value,
      employeeCount: overlay.querySelector('#fEmployees').value,
      dsFit: Number(overlay.querySelector('#fDsFit').value)||0,
      tags: overlay.querySelector('#fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
      mainBusiness: overlay.querySelector('#fBiz').value,
      strengths: overlay.querySelector('#fStrengths').value,
      weaknesses: overlay.querySelector('#fWeak').value,
      url: normalizeUrl(overlay.querySelector('#fUrl').value),
      mypageUrl: normalizeUrl(overlay.querySelector('#fMypageUrl').value),
      mypageId: overlay.querySelector('#fMypageId').value,
      mypagePassword: overlay.querySelector('#fMypagePassword').value,
    };
    registerSubIfNew(industryMajor, industrySub);
    const exists = companies.some(x=>x.id===c.id);
    saveCompanies(exists ? companies.map(x=>x.id===c.id?updated:x) : [...companies, updated]);
    detailId = updated.id; editMode=false; editDraft=null;
    renderOverlay(); afterChange();
  });

function allEvents(){
  const out = [];
  companies.forEach(c=>(c.events||[]).forEach((ev,idx)=>out.push({...ev, coId:c.id, coName:c.name, evIdx:idx})));
  return out;
}
function renderCalendarPage(){
  const page = document.getElementById('calPage');
  const year = calDate.getFullYear(), month = calDate.getMonth();
  const tod = today();
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const evs = allEvents();
  function getEvs(d){
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return evs.filter(e => ds>=e.date && ds<=evEnd(e));
  }
  const cells = []; for(let i=0;i<firstDay;i++) cells.push(null); for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const selEvs = calSel ? getEvs(calSel) : [];
  page.innerHTML = `
    <div class="view-row" style="margin-top:0;">
      <div></div>
      <button class="btn btn-primary" id="btnAddEvGlobal">＋ 予定を追加</button>
    </div>
    <div class="cal-wrap">
      <div class="cal-nav"><button data-cal="prev">‹</button><h3>${year}年${month+1}月</h3><button data-cal="next">›</button></div>
      <div class="cal-grid" style="margin-bottom:4px">${['日','月','火','水','木','金','土'].map((d,i)=>`<div class="cal-dh ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells.map((d,i)=>{
        if(!d) return '<div class="cal-cell empty"></div>';
        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayEvs = getEvs(d);
        const dow = i%7;
        let cls = calSel===d?'selected':ds===tod?'today':'';
        if(dayEvs.length>0) cls += ' has-event';
        return `<div class="cal-cell ${cls}" data-calday="${d}">
          <div class="cal-date ${dow===0?'sun':dow===6?'sat':''}">${d}</div>
          ${dayEvs.slice(0,3).map(e=>{ const col=evTypeColor(e.type); return `<div class="cal-dot" style="background:${col[0]};color:${col[1]}" title="${esc(e.type)}">${esc(e.coName.slice(0,4))}</div>`; }).join('')}
        </div>`;
      }).join('')}</div>
      ${calSel ? `<div class="cal-detail">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
          <div style="font-weight:700;font-size:13px;">${month+1}月${calSel}日の予定</div>
          <button class="btn btn-gray btn-sm" id="btnAddEvForDay">＋ この日に予定を追加</button>
        </div>
        ${selEvs.length===0?'<p class="note">予定なし</p>':selEvs.map(e=>`
          <div class="ev-card">
            <div class="ev-card-hd"><span class="tag" style="background:${evTypeColor(e.type)[0]};color:${evTypeColor(e.type)[1]}">${esc(e.type)}</span><span style="font-weight:600;cursor:pointer" data-gotocard="${e.coId}">${esc(e.coName)}</span><span class="note">${esc(fmtEv(e))}</span></div>
            ${e.memo?`<div class="ev-memo">${esc(e.memo)}</div>`:''}
          </div>`).join('')}
      </div>` : `
        ${evs.filter(e=>{ const ds0=`${year}-${String(month+1).padStart(2,'0')}`; return e.date.startsWith(ds0)||evEnd(e).startsWith(ds0); }).length>0 ? `
        <div class="cal-detail">
          <div style="font-size:12px;color:var(--sub);margin-bottom:6px">日付をクリックすると詳細が見られます</div>
        </div>` : ''}`}
    </div>
  `;
  page.querySelectorAll('[data-cal="prev"]').forEach(b=>b.addEventListener('click', ()=>{ calDate=new Date(year,month-1,1); calSel=null; renderCalendarPage(); }));
  page.querySelectorAll('[data-cal="next"]').forEach(b=>b.addEventListener('click', ()=>{ calDate=new Date(year,month+1,1); calSel=null; renderCalendarPage(); }));
  page.querySelectorAll('[data-calday]').forEach(el=>el.addEventListener('click', ()=>{ const d=Number(el.dataset.calday); calSel = calSel===d?null:d; renderCalendarPage(); }));
  page.querySelectorAll('[data-gotocard]').forEach(el=>el.addEventListener('click', ()=>openDetail(Number(el.dataset.gotocard))));
  const btnAddGlobal = page.querySelector('#btnAddEvGlobal');
  if(btnAddGlobal) btnAddGlobal.addEventListener('click', ()=>openAddEventModal());
  const btnAddForDay = page.querySelector('#btnAddEvForDay');
  if(btnAddForDay){
    const prefill = calSel ? `${year}-${String(month+1).padStart(2,'0')}-${String(calSel).padStart(2,'0')}` : '';
    btnAddForDay.addEventListener('click', ()=>openAddEventModal(prefill));
  }
}

const NOTE_CATEGORIES = ['自己PR','ガクチカ','強み・弱み','スキル・資格','志望動機の軸','面接Q&A','その他'];
const LS_NOTES_KEY = 'career-map-profile-notes-v1';

}
function saveProfileNotes(list){ profileNotes = list; try{ localStorage.setItem(LS_NOTES_KEY, JSON.stringify(list)); }catch(e){} }

function renderProfilePage(){
  const page = document.getElementById('profilePage');

          </div>`).join('')}
      </div>`;
    }).join('');

  page.innerHTML = `
    <div class="view-row" style="margin-top:0;">
      ${chipsHtml}
      <button class="btn btn-primary" id="btnAddNote" style="flex-shrink:0;">＋ ノートを追加</button>

    ${groupsHtml}
  `;
  bindProfileEvents();
}
function bindProfileEvents(){
  document.querySelectorAll('#noteCatFilters .chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.noteCategory = el.dataset.notecat==='all' ? null : el.dataset.notecat;
      renderProfilePage();
    });
  });

  if(addBtn) addBtn.addEventListener('click', openNoteAdd);

        saveProfileNotes(profileNotes.filter(x=>String(x.id)!==el.dataset.notedel));

    });
  });
}

  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      // 新形式 {companies, profileNotes} と、旧形式（企業配列そのまま）の両方に対応
      const coData = Array.isArray(data) ? data : data.companies;
      const noteData = Array.isArray(data) ? null : data.profileNotes;
      if(!Array.isArray(coData)) throw new Error('invalid');
      const noteMsg = Array.isArray(noteData) ? `・自己分析ノート${noteData.length}件` : '';
      if(confirm(`企業データ${coData.length}件${noteMsg}を読み込みます。現在のデータは上書きされます。よろしいですか？`)){
        saveCompanies(coData);
        if(Array.isArray(noteData)) saveProfileNotes(noteData);
        afterChange();
        if(state.tab==='profile') renderProfilePage();
      }
    }catch(err){ alert('JSONファイルの読み込みに失敗しました。'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});
document.getElementById('btnReset').addEventListener('click', ()=>{

  if(confirm('現在の企業データ・ステータス・メモ・予定をすべて削除し、初期データに戻します。よろしいですか？')){

// ───────────────────────── テーマ切り替え ─────────────────────────
const LS_THEME_KEY = 'career-map-theme';
function systemPrefersDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function effectiveTheme(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t==='dark'||t==='light') return t;
  return systemPrefersDark() ? 'dark' : 'light';
}
function updateThemeBtn(){
  document.getElementById('btnTheme').textContent = effectiveTheme()==='dark' ? '☀️' : '🌙';
}
function initTheme(){
  try{
    const saved = localStorage.getItem(LS_THEME_KEY);
    if(saved==='dark'||saved==='light') document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
  updateThemeBtn();
}
document.getElementById('btnTheme').addEventListener('click', ()=>{
  const next = effectiveTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(LS_THEME_KEY, next); }catch(e){}
  updateThemeBtn();
});
initTheme();

// ───────────────────────── 更新チェック（ホーム画面追加・古いキャッシュ対策）─────────────────────────
// スマホでホーム画面に追加した場合、OS側が古いページを表示し続けてしまうことがある。
// 表示中のページの<meta name="app-version">と、サーバー上の最新index.htmlのそれを比較し、
// 差があれば「更新する」バナーを出す。キャッシュを迂回するため必ずno-storeでfetchする。
function checkForAppUpdate(){
  try{
    const currentMeta = document.querySelector('meta[name="app-version"]');
    const current = currentMeta ? currentMeta.content : '';
    if(!current) return;
    fetch(location.pathname + '?_v=' + Date.now(), { cache:'no-store' })
      .then(r=>r.ok ? r.text() : null)
      .then(html=>{
        if(!html) return;
        const m = html.match(/<meta name="app-version" content="([^"]*)"/);
        const latest = m ? m[1] : '';
        if(latest && latest!==current) showUpdateBanner();
      })
      .catch(()=>{});
  }catch(e){}
}
function showUpdateBanner(){
  if(document.getElementById('appUpdateBanner')) return;
  const box = document.createElement('div');
  box.id = 'appUpdateBanner';
  box.className = 'update-banner';
  box.innerHTML = `<span>🔄 新しいバージョンが公開されています</span><button id="btnReloadApp">更新する</button>`;
  document.body.prepend(box);
  document.getElementById('btnReloadApp').addEventListener('click', ()=>{
    location.href = location.pathname + '?v=' + Date.now();
  });
}
checkForAppUpdate();
